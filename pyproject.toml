[project]
name = "pravoved"
version = "0.1.0"
description = "Правовед: локальный помощник по бытовому праву РФ (RAG + MCP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "sentence-transformers",
    "qdrant-client<1.16",
    "rank-bm25",
    "snowballstemmer",
    "numpy",
    "mcp>=1.2,<2",
    "langgraph",
    "langchain-openai",
    "langchain-mcp-adapters",
    "python-dotenv",
    "rich",
    "pytest",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
    "ddgs>=9.16.1",
    "python-docx>=1.2.0",
    "pytesseract>=0.3.13",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[tool.setuptools]
packages = ["pravoved", "pravoved.corpus", "pravoved.retrieval", "pravoved.mcp_server", "pravoved.agent", "pravoved.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
