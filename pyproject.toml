[project]
name = "pravoved"
version = "0.1.0"
description = "Правовед: локальный помощник по бытовому праву РФ (RAG + MCP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "sentence-transformers",
    "qdrant-client",
    "rank-bm25",
    "snowballstemmer",
    "numpy",
    "mcp>=1.2,<2",
    "langgraph",
    "langchain-openai",
    "langchain-mcp-adapters",
    "python-dotenv",
    "rich",
    "pytest",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
    "ddgs>=9.16.1",
]

[tool.setuptools]
packages = ["pravoved", "pravoved.corpus", "pravoved.retrieval", "pravoved.mcp_server", "pravoved.agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
